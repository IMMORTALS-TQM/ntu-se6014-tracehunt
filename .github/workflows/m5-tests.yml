name: M5 Hunt Workflow Tests

on:
  push:
    branches:
      - "m5/**"
    paths:
      - "m5-hunt/**"
      - ".github/workflows/m5-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "m5-hunt/**"
      - ".github/workflows/m5-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m5-tests:
    name: M5 unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run M5 unit tests
        run: python -B -m unittest discover -s m5-hunt -p "test_*.py" -v
